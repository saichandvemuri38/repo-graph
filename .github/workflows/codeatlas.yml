name: CodeAtlas

# On every push and pull request: run the tests, rebuild the code graph, say what the change touches, and keep the
# one-file HTML report available as a build artifact. Everything CodeAtlas needs is in the repo's .claude folder.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeatlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history is needed to diff against the previous commit or the PR base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .claude/engine/pyproject.toml

      - name: Install the engine
        run: pip install "./.claude/engine[all]" pytest

      - name: Engine tests (Python) and the PowerShell scripts (Pester, run by the same suite)
        working-directory: .claude/engine
        run: python -m pytest -q ../tests

      - name: Build the graph
        run: python -m atlas_engine index --full

      - name: What did this change touch?
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE="${PR_BASE:-$PUSH_BEFORE}"
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="HEAD~1" ;; esac
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE="HEAD"
          {
            echo "## CodeAtlas impact"
            python -m atlas_engine changes --base "$BASE" || true
          } >> "$GITHUB_STEP_SUMMARY"
          python -m atlas_engine check --base "$BASE" --fail-on none

      - name: Build the HTML report
        run: python -m atlas_engine --no-refresh report

      - uses: actions/upload-artifact@v4
        with:
          name: codeatlas-report
          path: .claude/atlas/report/index.html
          if-no-files-found: error

  # Optional: publish the report to GitHub Pages. Off by default because Pages sites are public unless your plan
  # restricts them, and the report contains your source code and call structure.
  # Enable it with the repository variable CODEATLAS_PAGES=true and Pages source "GitHub Actions".
  pages:
    needs: index
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CODEATLAS_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codeatlas-report
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
