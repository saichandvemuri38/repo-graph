<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="codeatlas-token" content="__TOKEN__">
<title>CodeAtlas Explorer</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="brand"><span class="logo" aria-hidden="true">◈</span> CodeAtlas</div>
    <div class="menu-anchor">
      <button id="btn-project" class="btn ghost" aria-haspopup="true" aria-expanded="false" title="Switch repository">
        <span id="project-name">Loading…</span> <span class="caret">▾</span>
      </button>
      <div id="project-menu" class="dropdown" hidden></div>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search nodes…  (Ctrl/⌘ K)" autocomplete="off" spellcheck="false" aria-label="Search nodes">
      <div id="search-results" class="dropdown" role="listbox" hidden></div>
    </div>
    <div class="spacer"></div>
    <button id="btn-changes" class="btn ghost" title="Highlight symbols changed since the last commit or index">Changes</button>
    <button id="btn-ai" class="btn primary" title="Ask Nexus AI">✦ Nexus AI</button>
    <button id="btn-settings" class="btn icon" title="Settings" aria-label="Settings">⚙</button>
    <button id="btn-help" class="btn icon" title="Help (?)" aria-label="Help">?</button>
    <button id="btn-theme" class="btn icon" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>

  <main id="main">
    <aside id="left" aria-label="Explorer">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="explorer" role="tab">Explorer</button>
        <button class="tab" data-tab="filters" role="tab">Filters</button>
      </div>
      <div id="left-explorer" class="pane"></div>
      <div id="left-filters" class="pane" hidden></div>
    </aside>

    <section id="stage" aria-label="Graph">
      <div id="sigma"></div>
      <div id="toolbar" role="toolbar" aria-label="Graph controls"></div>
      <div id="legend"></div>
      <div id="overlay" hidden></div>
      <button id="fab-query" class="fab" title="Query console (SQL)">⌗ Query</button>
    </section>

    <div id="resizer" title="Drag to resize"></div>
    <aside id="right" aria-label="Details">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="details" role="tab">Details</button>
        <button class="tab" data-tab="code" role="tab">Code</button>
        <button class="tab" data-tab="flows" role="tab">Flows</button>
        <button class="tab" data-tab="clusters" role="tab">Clusters</button>
        <button class="tab" data-tab="ai" role="tab">Nexus AI</button>
      </div>
      <div id="right-details" class="pane"></div>
      <div id="right-code" class="pane" hidden></div>
      <div id="right-flows" class="pane" hidden></div>
      <div id="right-clusters" class="pane" hidden></div>
      <div id="right-ai" class="pane" hidden></div>
    </aside>
  </main>

  <footer id="status" role="status"></footer>
</div>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>

<script src="/vendor/graphology.umd.min.js"></script>
<script src="/vendor/sigma.min.js"></script>
<script src="/vendor/forceatlas2.bundle.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
